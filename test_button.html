<!DOCTYPE html>
<html>
<head>
  <title>Test Button Color</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Test CSS simple */
    .test-button.btn-primary {
      background-color: #0d6efd !important;
      border-color: #0d6efd !important;
      color: white !important;
    }

    .test-button.btn-outline-primary {
      background-color: transparent !important;
      color: #0d6efd !important;
      border-color: #0d6efd !important;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1>Test Button Color Change</h1>

    <button id="testBtn" class="btn btn-outline-primary test-button">
      Test Button
    </button>

    <br><br>

    <button onclick="changeColor()" class="btn btn-success">
      Change to Blue
    </button>

    <button onclick="resetColor()" class="btn btn-secondary">
      Reset to White
    </button>
  </div>

  <script>
    function changeColor() {
      const btn = document.getElementById('testBtn');
      console.log('Before:', btn.className);

      btn.classList.remove('btn-outline-primary');
      btn.classList.add('btn-primary');

      // Force style
      btn.style.backgroundColor = '#0d6efd';
      btn.style.borderColor = '#0d6efd';
      btn.style.color = 'white';

      console.log('After:', btn.className);
      console.log('Style:', btn.style.cssText);
    }

    function resetColor() {
      const btn = document.getElementById('testBtn');
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-outline-primary');
      btn.style.cssText = '';
    }
  </script>
</body>
</html>
