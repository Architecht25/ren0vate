<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="test-token">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dashboard Sécurité Rénov'ate</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">🛡️ Module Sécurité - Test</h1>
                </div>
            </div>
        </div>

        <!-- Module Sécurité -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-shield-check me-2"></i>Headers de sécurité</h5>
                        <span class="badge bg-success">Actif</span>
                    </div>
                    <div class="card-body">
                        <p class="card-text">Configuration et test des headers HTTP de sécurité.</p>
                        <button id="test-headers-btn" class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-search me-2"></i>Tester les headers
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Violations CSP</h5>
                        <span id="csp-violations-count" class="badge bg-warning">0</span>
                    </div>
                    <div class="card-body">
                        <p class="card-text">Surveillance des violations de politique de sécurité.</p>
                        <button id="view-csp-violations-btn" class="btn btn-warning btn-sm w-100">
                            <i class="bi bi-eye me-2"></i>Voir les violations CSP
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-envelope-check me-2"></i>Confirmations email</h5>
                        <span class="badge bg-info">Actif</span>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <small>Confirmés</small>
                            <span id="confirmed-users-count" class="badge bg-success">-</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <small>En attente</small>
                            <span id="unconfirmed-users-count" class="badge bg-warning">-</span>
                        </div>
                        <button id="manage-confirmations-btn" class="btn btn-info btn-sm w-100">
                            <i class="bi bi-gear me-2"></i>Gestion confirmations
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Test SweetAlert2 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5>Test des fonctionnalités</h5>
                        <button onclick="testSwalAlert()" class="btn btn-success me-2">
                            Test SweetAlert2
                        </button>
                        <button onclick="console.log('Console test')" class="btn btn-secondary">
                            Test Console
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript identique au dashboard corrigé -->
    <script>
        function generateAutomaticNotifications() {
            if (confirm('Générer des notifications automatiques pour tous les utilisateurs éligibles ?')) {
                fetch('/notifications/generate_automatic', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': document.querySelector('[name="csrf-token"]').content
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(`${data.count} notifications automatiques générées avec succès !`);
                        location.reload();
                    } else {
                        alert('Erreur lors de la génération des notifications');
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert('Erreur lors de la génération des notifications');
                });
            }
        }

        // Fonctions de sécurité
        function testSecurityHeaders() {
            const currentUrl = window.location.origin;

            Swal.fire({
                title: 'Test des headers de sécurité',
                html: `
                    <div class="text-start">
                        <p class="mb-3">Test en cours des headers de sécurité pour :</p>
                        <code>${currentUrl}</code>
                        <div class="mt-3 spinner-border spinner-border-sm text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted small">Vérification HTTPS, HSTS, CSP, X-Frame-Options...</p>
                    </div>
                `,
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            }).then(() => {
                // Simuler un test réussi pour la démonstration
                Swal.fire({
                    title: '✅ Headers de sécurité',
                    html: `
                        <div class="text-start">
                            <p>Test terminé - Headers configurés :</p>
                            <ul class="list-unstyled">
                                <li>🔒 HTTPS/SSL : <span class="badge bg-success">Actif</span></li>
                                <li>🛡️ HSTS : <span class="badge bg-success">31536000s</span></li>
                                <li>👁️ CSP : <span class="badge bg-success">Enforcement</span></li>
                                <li>🖼️ X-Frame-Options : <span class="badge bg-success">SAMEORIGIN</span></li>
                                <li>🚫 X-XSS-Protection : <span class="badge bg-success">mode=block</span></li>
                            </ul>
                        </div>
                    `,
                    icon: 'success'
                });
            });
        }

        function viewCSPViolations() {
            Swal.fire({
                title: '📊 Violations CSP',
                html: `
                    <div class="text-start">
                        <p class="mb-3">Violations Content Security Policy :</p>
                        <div class="alert alert-success" role="alert">
                            <i class="bi bi-check-circle me-2"></i>
                            Aucune violation critique détectée dans les 24 dernières heures
                        </div>
                        <div class="mt-3">
                            <h6>Monitoring actif :</h6>
                            <ul class="list-unstyled">
                                <li>• Endpoint : <code>/csp-violation-report-endpoint</code></li>
                                <li>• Mode : Enforcement</li>
                                <li>• Logging : Automatique</li>
                            </ul>
                        </div>
                        <div class="mt-3">
                            <small class="text-muted">
                                Les violations sont analysées automatiquement et les tentatives d'attaque XSS sont détectées.
                            </small>
                        </div>
                    </div>
                `,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Voir les logs',
                cancelButtonText: 'Fermer'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Simulation pour le test
                    Swal.fire('Info', 'Redirection vers les logs simulée', 'info');
                }
            });
        }

        function manageEmailConfirmations() {
            // Données simulées pour le test
            const totalUsers = 150;
            const confirmedUsers = 132;
            const unconfirmedUsers = 18;
            const confirmationRate = Math.round((confirmedUsers / totalUsers) * 100);

            Swal.fire({
                title: '📧 Gestion des Confirmations Email',
                html: `
                    <div class="text-start">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <div class="card border-success">
                                    <div class="card-body text-center">
                                        <i class="bi bi-check-circle-fill text-success fs-1"></i>
                                        <h5 class="text-success">${confirmedUsers}</h5>
                                        <p class="mb-0">Confirmés</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border-warning">
                                    <div class="card-body text-center">
                                        <i class="bi bi-hourglass-split text-warning fs-1"></i>
                                        <h5 class="text-warning">${unconfirmedUsers}</h5>
                                        <p class="mb-0">En attente</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border-info">
                                    <div class="card-body text-center">
                                        <i class="bi bi-graph-up text-info fs-1"></i>
                                        <h5 class="text-info">${confirmationRate}%</h5>
                                        <p class="mb-0">Taux confirm.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <h6>Configuration actuelle :</h6>
                            <ul class="list-unstyled">
                                <li>• Délai d'accès non confirmé : 2 jours</li>
                                <li>• Validité token : 3 jours</li>
                                <li>• Reconfirmation : Activée</li>
                                <li>• Mailer : UserMailer (personnalisé)</li>
                            </ul>
                        </div>

                        <div class="alert alert-info mt-3">
                            <i class="bi bi-info-circle me-2"></i>
                            Les utilisateurs non confirmés ont un accès limité à la plateforme jusqu'à validation de leur email.
                        </div>
                    </div>
                `,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Voir les utilisateurs',
                cancelButtonText: 'Fermer',
                width: '600px'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Simulation pour le test
                    Swal.fire('Info', 'Redirection vers la gestion des utilisateurs simulée', 'info');
                }
            });
        }

        // Auto-refresh du compteur de violations CSP
        function updateCSPViolationsCount() {
            // Simuler un compteur (en réalité, cela viendrait d'une API)
            const count = 0; // Dans un vrai cas, fetch depuis une API
            const element = document.getElementById('csp-violations-count');
            if (element) {
                element.textContent = count;
            }
        }

        // Charger les données de sécurité simulées
        function loadSecurityData() {
            // Données simulées pour le test
            const confirmedElement = document.getElementById('confirmed-users-count');
            const unconfirmedElement = document.getElementById('unconfirmed-users-count');

            if (confirmedElement) confirmedElement.textContent = '132';
            if (unconfirmedElement) unconfirmedElement.textContent = '18';
        }

        // Mettre à jour les compteurs au chargement
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Dashboard JavaScript loaded');
            updateCSPViolationsCount();
            loadSecurityData();

            // Ajouter les event listeners pour les boutons de sécurité
            const testHeadersBtn = document.getElementById('test-headers-btn');
            const viewCSPBtn = document.getElementById('view-csp-violations-btn');
            const manageConfirmationsBtn = document.getElementById('manage-confirmations-btn');

            console.log('Buttons found:', {
                testHeadersBtn: !!testHeadersBtn,
                viewCSPBtn: !!viewCSPBtn,
                manageConfirmationsBtn: !!manageConfirmationsBtn
            });

            if (testHeadersBtn) {
                testHeadersBtn.addEventListener('click', function() {
                    console.log('Test headers button clicked');
                    testSecurityHeaders();
                });
            }

            if (viewCSPBtn) {
                viewCSPBtn.addEventListener('click', function() {
                    console.log('View CSP violations button clicked');
                    viewCSPViolations();
                });
            }

            if (manageConfirmationsBtn) {
                manageConfirmationsBtn.addEventListener('click', function() {
                    console.log('Manage confirmations button clicked');
                    manageEmailConfirmations();
                });
            }

            // Actualiser les données toutes les 30 secondes
            setInterval(loadSecurityData, 30000);
        });

        // Test simple pour vérifier SweetAlert2
        function testSwalAlert() {
            Swal.fire({
                title: 'Test SweetAlert2',
                text: 'SweetAlert2 fonctionne correctement !',
                icon: 'success'
            });
        }

        // Rendre les fonctions accessibles globalement pour les tests
        window.testSecurityHeaders = testSecurityHeaders;
        window.viewCSPViolations = viewCSPViolations;
        window.manageEmailConfirmations = manageEmailConfirmations;
        window.testSwalAlert = testSwalAlert;
    </script>
</body>
</html>
