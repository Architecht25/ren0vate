<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- ─── Background ─────────────────────────────────── -->
  <rect width="512" height="512" fill="#0d1f3c"/>

  <!-- Faint PCB grid in sky area (renotech background texture) -->
  <!-- Horizontal traces -->
  <line x1="30"  y1="44"  x2="120" y2="44"  stroke="#1a3561" stroke-width="1.5"/>
  <line x1="120" y1="44"  x2="120" y2="30"  stroke="#1a3561" stroke-width="1.5"/>
  <circle cx="120" cy="30" r="3.5" fill="#1a3561"/>

  <line x1="392" y1="44"  x2="480" y2="44"  stroke="#1a3561" stroke-width="1.5"/>
  <line x1="392" y1="44"  x2="392" y2="30"  stroke="#1a3561" stroke-width="1.5"/>
  <circle cx="392" cy="30" r="3.5" fill="#1a3561"/>

  <line x1="60"  y1="458" x2="148" y2="458" stroke="#162d52" stroke-width="1.5"/>
  <line x1="364" y1="458" x2="452" y2="458" stroke="#162d52" stroke-width="1.5"/>

  <!-- ─── House ────────────────────────────────────────── -->
  <!-- Chimney (behind roof) -->
  <rect x="318" y="152" width="36" height="108" rx="3" fill="#eef3fc"/>
  <rect x="313" y="152" width="46" height="8"   rx="2" fill="#c8d5ec"/>

  <!-- Roof -->
  <polygon points="256,70 444,262 68,262" fill="#eef3fc"/>
  <polygon points="256,70 275,98 237,98"  fill="#dde6f7"/>
  <line    x1="68" y1="262" x2="444" y2="262" stroke="#c8d5ec" stroke-width="3"/>

  <!-- House body -->
  <rect x="82" y="256" width="348" height="198" rx="5" fill="#eef3fc"/>

  <!-- Left window -->
  <rect x="110" y="280" width="78" height="68" rx="5" fill="#1a3561"/>
  <line x1="149" y1="280" x2="149" y2="348" stroke="#2a4a80" stroke-width="2"/>
  <line x1="110" y1="314" x2="188" y2="314" stroke="#2a4a80" stroke-width="2"/>
  <rect x="106" y="346" width="86"  height="6" rx="2" fill="#c8d5ec"/>

  <!-- Right window -->
  <rect x="324" y="280" width="78" height="68" rx="5" fill="#1a3561"/>
  <line x1="363" y1="280" x2="363" y2="348" stroke="#2a4a80" stroke-width="2"/>
  <line x1="324" y1="314" x2="402" y2="314" stroke="#2a4a80" stroke-width="2"/>
  <rect x="320" y="346" width="86"  height="6" rx="2" fill="#c8d5ec"/>

  <!-- Arched door -->
  <rect   x="214" y="360" width="84" height="94"   fill="#1a3561"/>
  <ellipse cx="256" cy="360" rx="42" ry="22"        fill="#1a3561"/>
  <circle  cx="283" cy="406" r="5"                  fill="#4a72aa"/>
  <rect   x="206" y="452" width="100" height="7" rx="2" fill="#c8d5ec"/>

  <!-- ─── Tech "0" — Ren0vate renotech signature ────── -->
  <!--
    The "0" is a PCB-style ring centered in the gable.
    It represents:
      • the zero in Ren0vate (brand)
      • a circuit board pad/via (IT/tech)
      • a porthole window (renovation/architecture)
    Four orthogonal circuit traces radiate from 12/3/6/9 o'clock,
    each ending in a square PCB landing pad — the language of
    embedded electronics brought to renovation.
  -->

  <!-- Dark pocket behind ring (punch through the white roof) -->
  <circle cx="256" cy="184" r="46" fill="#0d1f3c"/>

  <!-- Outer ring — the "0" bold stroke -->
  <circle cx="256" cy="184" r="36" fill="none" stroke="#ffffff" stroke-width="9"/>

  <!-- Inner ring faint echo (double-ring = precision tech) -->
  <circle cx="256" cy="184" r="22" fill="none" stroke="#00c8e0" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- ·· North trace: up then elbow right ·· -->
  <line x1="256" y1="148" x2="256" y2="120" stroke="#00c8e0" stroke-width="3"/>
  <line x1="256" y1="120" x2="274" y2="120" stroke="#00c8e0" stroke-width="3"/>
  <rect x="270" y="114" width="12" height="12" rx="2" fill="#00c8e0"/>   <!-- PCB pad -->

  <!-- ·· East trace: right then elbow up ·· -->
  <line x1="292" y1="184" x2="316" y2="184" stroke="#00c8e0" stroke-width="3"/>
  <line x1="316" y1="184" x2="316" y2="166" stroke="#00c8e0" stroke-width="3"/>
  <rect x="310" y="160" width="12" height="12" rx="2" fill="#00c8e0"/>

  <!-- ·· West trace: left then elbow up ·· -->
  <line x1="220" y1="184" x2="196" y2="184" stroke="#00c8e0" stroke-width="3"/>
  <line x1="196" y1="184" x2="196" y2="166" stroke="#00c8e0" stroke-width="3"/>
  <rect x="190" y="160" width="12" height="12" rx="2" fill="#00c8e0"/>

  <!-- ·· South trace: down into the house (tech meets building) ·· -->
  <line x1="256" y1="220" x2="256" y2="256" stroke="#00c8e0" stroke-width="3" opacity="0.45"/>

  <!-- Central via dot (the "soul" of the PCB zero) -->
  <circle cx="256" cy="184" r="5" fill="#00c8e0"/>

</svg>
