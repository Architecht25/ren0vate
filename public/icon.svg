<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- ─── Fond — tuile circulaire ─────────────────────── -->
  <circle cx="256" cy="256" r="256" fill="#0d1f3c"/>

  <!-- ─── Ren0vate "0" — anneau de progression ──────────
    Le "0" devient une jauge circulaire : anneau de fond
    sombre + arc cyan représentant l'avancement d'un
    chantier, avec un check au centre (travaux validés).
  -->

  <!-- Groupe compressé horizontalement : lit comme un "0" de typo plutôt qu'un cercle -->
  <g transform="translate(256 256) scale(0.78 1) translate(-256 -256)">

    <!-- Anneau de fond (le "0" complet, discret) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#1a3561" stroke-width="40"/>

    <!-- Arc de progression (~72%) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#00c8e0" stroke-width="40"
            stroke-linecap="round"
            stroke-dasharray="724 1005"
            transform="rotate(-90 256 256)"/>
  </g>

  <!-- Check — travaux validés (hors du groupe compressé, pour rester bien proportionné) -->
  <path d="M204 260 l36 36 l68 -78" fill="none" stroke="#eef3fc" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>

</svg>
