<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Boutons Sécurité</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test des boutons de sécurité</h1>

        <div class="row mt-4">
            <div class="col-md-4">
                <button id="test-headers-btn" class="btn btn-primary w-100">
                    <i class="bi bi-shield-check me-2"></i>
                    Tester les headers
                </button>
            </div>
            <div class="col-md-4">
                <button id="view-csp-violations-btn" class="btn btn-warning w-100">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Voir violations CSP
                </button>
            </div>
            <div class="col-md-4">
                <button id="manage-confirmations-btn" class="btn btn-info w-100">
                    <i class="bi bi-envelope-check me-2"></i>
                    Gestion confirmations
                </button>
            </div>
        </div>

        <div class="mt-4">
            <button onclick="testSwalAlert()" class="btn btn-success">
                Test SweetAlert2
            </button>
        </div>
    </div>

    <script>
        // Functions de test simplifiées
        function testSecurityHeaders() {
            Swal.fire({
                title: 'Test Headers',
                text: 'Headers de sécurité testés avec succès !',
                icon: 'success'
            });
        }

        function viewCSPViolations() {
            Swal.fire({
                title: 'Violations CSP',
                text: 'Aucune violation détectée',
                icon: 'info'
            });
        }

        function manageEmailConfirmations() {
            Swal.fire({
                title: 'Confirmations Email',
                text: 'Gestion des confirmations email',
                icon: 'info'
            });
        }

        function testSwalAlert() {
            Swal.fire({
                title: 'Test SweetAlert2',
                text: 'SweetAlert2 fonctionne !',
                icon: 'success'
            });
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Test page loaded');

            document.getElementById('test-headers-btn').addEventListener('click', testSecurityHeaders);
            document.getElementById('view-csp-violations-btn').addEventListener('click', viewCSPViolations);
            document.getElementById('manage-confirmations-btn').addEventListener('click', manageEmailConfirmations);

            console.log('Event listeners added');
        });
    </script>
</body>
</html>
