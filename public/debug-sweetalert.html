<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Debug SweetAlert2</title>

    <!-- Mêmes scripts que le dashboard -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>🐛 Test Debug SweetAlert2</h1>
        <p class="mb-4">Cette page teste spécifiquement SweetAlert2</p>

        <div class="row">
            <div class="col-md-3">
                <button id="test1" class="btn btn-primary w-100 mb-2">Test 1: SweetAlert simple</button>
            </div>
            <div class="col-md-3">
                <button id="test2" class="btn btn-warning w-100 mb-2">Test 2: SweetAlert avec HTML</button>
            </div>
            <div class="col-md-3">
                <button id="test3" class="btn btn-info w-100 mb-2">Test 3: SweetAlert temporisé</button>
            </div>
            <div class="col-md-3">
                <button id="test4" class="btn btn-success w-100 mb-2">Test 4: SweetAlert avec prompt</button>
            </div>
        </div>

        <div class="mt-4">
            <h3>Debug Info</h3>
            <pre id="debug-info"></pre>
        </div>
    </div>

    <script>
        // Fonction pour afficher les infos de debug
        function updateDebugInfo() {
            const debugEl = document.getElementById('debug-info');
            debugEl.textContent = `
SweetAlert2 disponible: ${typeof Swal !== 'undefined'}
Version SweetAlert2: ${typeof Swal !== 'undefined' ? (Swal.version || 'inconnue') : 'N/A'}
Bootstrap disponible: ${typeof bootstrap !== 'undefined'}
Date/Heure: ${new Date().toLocaleString()}
User Agent: ${navigator.userAgent}
            `.trim();
        }

        // Tests SweetAlert2
        document.getElementById('test1').addEventListener('click', function() {
            console.log('Test 1 clicked');
            try {
                Swal.fire({
                    title: 'Test 1',
                    text: 'SweetAlert2 simple fonctionne !',
                    icon: 'success'
                });
            } catch (error) {
                console.error('Erreur Test 1:', error);
                alert('Erreur Test 1: ' + error.message);
            }
        });

        document.getElementById('test2').addEventListener('click', function() {
            console.log('Test 2 clicked');
            try {
                Swal.fire({
                    title: 'Test 2 - HTML',
                    html: `
                        <div class="text-start">
                            <p>Test avec du <strong>HTML</strong></p>
                            <ul>
                                <li>Item 1</li>
                                <li>Item 2</li>
                            </ul>
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i> Info Alert
                            </div>
                        </div>
                    `,
                    icon: 'info'
                });
            } catch (error) {
                console.error('Erreur Test 2:', error);
                alert('Erreur Test 2: ' + error.message);
            }
        });

        document.getElementById('test3').addEventListener('click', function() {
            console.log('Test 3 clicked');
            try {
                Swal.fire({
                    title: 'Test 3 - Timer',
                    text: 'Cette alerte se ferme automatiquement en 3 secondes',
                    timer: 3000,
                    timerProgressBar: true,
                    showConfirmButton: false
                });
            } catch (error) {
                console.error('Erreur Test 3:', error);
                alert('Erreur Test 3: ' + error.message);
            }
        });

        document.getElementById('test4').addEventListener('click', function() {
            console.log('Test 4 clicked');
            try {
                Swal.fire({
                    title: 'Test 4 - Prompt',
                    input: 'text',
                    inputLabel: 'Entrez votre nom',
                    inputPlaceholder: 'Votre nom ici...',
                    showCancelButton: true,
                    confirmButtonText: 'Valider',
                    cancelButtonText: 'Annuler'
                }).then((result) => {
                    if (result.isConfirmed && result.value) {
                        Swal.fire(`Bonjour ${result.value} !`, '', 'success');
                    }
                });
            } catch (error) {
                console.error('Erreur Test 4:', error);
                alert('Erreur Test 4: ' + error.message);
            }
        });

        // Mise à jour des infos de debug au chargement
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Debug page loaded');
            updateDebugInfo();

            // Test automatique de SweetAlert2
            setTimeout(function() {
                if (typeof Swal !== 'undefined') {
                    console.log('Auto-test SweetAlert2...');
                    try {
                        Swal.fire({
                            title: 'Auto-test réussi !',
                            text: 'SweetAlert2 est correctement chargé',
                            icon: 'success',
                            timer: 2000,
                            showConfirmButton: false
                        });
                    } catch (error) {
                        console.error('Auto-test failed:', error);
                    }
                } else {
                    console.error('SweetAlert2 not available!');
                    alert('❌ SweetAlert2 n\'est pas disponible !');
                }
            }, 1000);
        });
    </script>
</body>
</html>
