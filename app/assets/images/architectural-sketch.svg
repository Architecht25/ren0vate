<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Grille technique en arrière-plan -->
  <defs>
    <pattern id="techGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#d4d4d4" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    
    <!-- Filtres pour effet watercolor -->
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offset"/>
      <feFlood flood-color="#e8dcc6" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond papier avec grille -->
  <rect width="100%" height="100%" fill="#faf9f7" />
  <rect width="100%" height="100%" fill="url(#techGrid)" />

  <!-- FAÇADE PRINCIPALE "ARCLINE" (inspirée de l'illustration) -->
  <g filter="url(#watercolor)">
    
    <!-- Base de la façade -->
    <rect x="180" y="120" width="200" height="380" fill="#f5f2eb" stroke="#8a8a8a" stroke-width="1.5" opacity="0.9"/>
    
    <!-- ÉTAGE 3 -->
    <!-- Fenêtre mansardée gauche -->
    <rect x="195" y="140" width="35" height="45" fill="#e6f3ff" stroke="#6b6b6b" stroke-width="1"/>
    <rect x="203" y="148" width="8" height="30" fill="none" stroke="#6b6b6b" stroke-width="0.5"/>
    <rect x="215" y="148" width="8" height="30" fill="none" stroke="#6b6b6b" stroke-width="0.5"/>
    
    <!-- ÉTAGE 2 -->
    <!-- Grande fenêtre centrale avec arc -->
    <path d="M 240 200 Q 290 180 340 200" fill="none" stroke="#6b6b6b" stroke-width="2"/>
    <rect x="245" y="200" width="90" height="80" fill="#e6f3ff" stroke="#6b6b6b" stroke-width="1.2"/>
    <line x1="290" y1="200" x2="290" y2="280" stroke="#6b6b6b" stroke-width="0.8"/>
    <line x1="245" y1="240" x2="335" y2="240" stroke="#6b6b6b" stroke-width="0.8"/>
    
    <!-- Balcon avec garde-corps -->
    <rect x="240" y="280" width="100" height="8" fill="#d4c4a8" stroke="#6b6b6b" stroke-width="0.8"/>
    <g stroke="#6b6b6b" stroke-width="0.6" fill="none">
      <line x1="245" y1="288" x2="245" y2="300"/>
      <line x1="255" y1="288" x2="255" y2="300"/>
      <line x1="265" y1="288" x2="265" y2="300"/>
      <line x1="275" y1="288" x2="275" y2="300"/>
      <line x1="285" y1="288" x2="285" y2="300"/>
      <line x1="295" y1="288" x2="295" y2="300"/>
      <line x1="305" y1="288" x2="305" y2="300"/>
      <line x1="315" y1="288" x2="315" y2="300"/>
      <line x1="325" y1="288" x2="325" y2="300"/>
      <line x1="335" y1="288" x2="335" y2="300"/>
      <line x1="240" y1="300" x2="340" y2="300" stroke-width="1"/>
    </g>
    
    <!-- Fenêtre gauche étage 2 -->
    <rect x="195" y="220" width="35" height="50" fill="#e6f3ff" stroke="#6b6b6b" stroke-width="1"/>
    <line x1="212" y1="220" x2="212" y2="270" stroke="#6b6b6b" stroke-width="0.5"/>
    
    <!-- ÉTAGE 1 / REZ-DE-CHAUSSÉE -->
    <!-- Porte d'entrée avec arc -->
    <path d="M 195 320 Q 212 310 230 320" fill="none" stroke="#6b6b6b" stroke-width="1.5"/>
    <rect x="200" y="320" width="25" height="80" fill="#d4a574" stroke="#6b6b6b" stroke-width="1.2"/>
    <circle cx="220" cy="360" r="1.5" fill="#8a8a8a"/>
    <rect x="208" y="335" width="10" height="15" fill="#a68b5b" stroke="#6b6b6b" stroke-width="0.5"/>
    
    <!-- BOUTIQUE "ARCLINE" -->
    <!-- Grande vitrine -->
    <rect x="235" y="340" width="130" height="120" fill="#f0f8ff" stroke="#2c5530" stroke-width="2"/>
    <rect x="240" y="345" width="120" height="110" fill="#f8fcff" stroke="#2c5530" stroke-width="0.5"/>
    
    <!-- Divisions de vitrine -->
    <line x1="300" y1="340" x2="300" y2="460" stroke="#2c5530" stroke-width="1"/>
    <line x1="235" y1="400" x2="365" y2="400" stroke="#2c5530" stroke-width="1"/>
    
    <!-- Enseigne "ARCLINE" -->
    <rect x="250" y="320" width="100" height="20" fill="#2c5530" opacity="0.9"/>
    <text x="300" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffffff" font-weight="bold">Arcline</text>
    
    <!-- Porte vitrine droite -->
    <rect x="340" y="420" width="25" height="40" fill="#d4a574" stroke="#2c5530" stroke-width="1"/>
    <circle cx="358" cy="440" r="1" fill="#2c5530"/>
    
    <!-- Terrasse/marches -->
    <rect x="175" y="460" width="210" height="15" fill="#e8e0d0" stroke="#8a8a8a" stroke-width="0.5"/>
    <rect x="175" y="475" width="210" height="8" fill="#d4c4a8" stroke="#8a8a8a" stroke-width="0.5"/>
  </g>

  <!-- VÉGÉTATION (style watercolor) -->
  <g opacity="0.7">
    <!-- Plantes sur balcon -->
    <ellipse cx="250" cy="295" rx="8" ry="5" fill="#7a9b57" opacity="0.6"/>
    <ellipse cx="330" cy="295" rx="10" ry="6" fill="#7a9b57" opacity="0.6"/>
    
    <!-- Petite plante terrasse -->
    <ellipse cx="370" cy="470" rx="12" ry="8" fill="#7a9b57" opacity="0.5"/>
    <path d="M 365 470 Q 370 460 375 470" stroke="#5a7a3a" stroke-width="1" fill="none"/>
  </g>

  <!-- ANNOTATIONS MANUSCRITES (style architectural) -->
  <g fill="#8a6a4a" font-family="Georgia, serif" font-size="8" opacity="0.6">
    
    <!-- Annotations gauche -->
    <g transform="rotate(-90, 120, 200)">
      <text x="120" y="200" font-style="italic">Façade rue</text>
    </g>
    
    <!-- Lignes de côte verticales -->
    <line x1="150" y1="120" x2="150" y2="480" stroke="#8a6a4a" stroke-width="0.3" stroke-dasharray="2,2" opacity="0.4"/>
    <line x1="145" y1="120" x2="155" y2="120" stroke="#8a6a4a" stroke-width="0.5"/>
    <line x1="145" y1="320" x2="155" y2="320" stroke="#8a6a4a" stroke-width="0.5"/>
    <line x1="145" y1="480" x2="155" y2="480" stroke="#8a6a4a" stroke-width="0.5"/>
    
    <!-- Annotations droite -->
    <text x="420" y="150" font-style="italic" font-size="9">Commerce</text>
    <text x="420" y="165" font-style="italic" font-size="8">+ logements</text>
    
    <text x="420" y="200" font-size="7">Étage noble</text>
    <text x="420" y="350" font-size="7">Rez commercial</text>
    <text x="420" y="420" font-size="9" font-weight="bold">ARCLINE</text>
    
    <!-- Flèches de référence -->
    <line x1="410" y1="155" x2="370" y2="140" stroke="#8a6a4a" stroke-width="0.5"/>
    <polygon points="370,140 375,138 372,143" fill="#8a6a4a"/>
    
    <line x1="410" y1="425" x2="350" y2="400" stroke="#8a6a4a" stroke-width="0.5"/>
    <polygon points="350,400 355,398 352,403" fill="#8a6a4a"/>
    
    <!-- Mesures -->
    <text x="300" y="520" text-anchor="middle" font-size="6">± 20.0m</text>
    <line x1="180" y1="510" x2="380" y2="510" stroke="#8a6a4a" stroke-width="0.3" stroke-dasharray="1,1"/>
    <line x1="180" y1="505" x2="180" y2="515" stroke="#8a6a4a" stroke-width="0.5"/>
    <line x1="380" y1="505" x2="380" y2="515" stroke="#8a6a4a" stroke-width="0.5"/>
  </g>

  <!-- NOTES MANUSCRITES EN BAS -->
  <g fill="#8a6a4a" font-family="Georgia, serif" opacity="0.4">
    <text x="50" y="580" font-style="italic" font-size="10">Rénovation énergétique • Isolation thermique</text>
    <text x="450" y="580" font-style="italic" font-size="8">Ren0vate - Étude de cas</text>
  </g>

  <!-- EFFET AQUARELLE SUBTILE -->
  <g opacity="0.1">
    <ellipse cx="150" cy="250" rx="60" ry="40" fill="#c4b5a0"/>
    <ellipse cx="450" cy="200" rx="50" ry="70" fill="#a5b4c4"/>
    <ellipse cx="300" cy="500" rx="80" ry="30" fill="#b4c4a5"/>
  </g>
  
</svg>