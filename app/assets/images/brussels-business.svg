<svg width="300" height="250" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1ecf1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="300" height="250" fill="url(#bgGradient)"/>
  
  <!-- Bâtiments stylisés représentant Bruxelles -->
  <rect x="50" y="150" width="40" height="80" fill="url(#buildingGradient)" rx="2"/>
  <rect x="100" y="130" width="35" height="100" fill="url(#buildingGradient)" rx="2"/>
  <rect x="145" y="140" width="30" height="90" fill="url(#buildingGradient)" rx="2"/>
  <rect x="185" y="120" width="45" height="110" fill="url(#buildingGradient)" rx="2"/>
  <rect x="240" y="160" width="35" height="70" fill="url(#buildingGradient)" rx="2"/>
  
  <!-- Fenêtres -->
  <rect x="55" y="160" width="8" height="8" fill="#ffffff" opacity="0.8"/>
  <rect x="55" y="175" width="8" height="8" fill="#ffffff" opacity="0.8"/>
  <rect x="55" y="190" width="8" height="8" fill="#ffffff" opacity="0.8"/>
  <rect x="75" y="160" width="8" height="8" fill="#ffffff" opacity="0.8"/>
  <rect x="75" y="175" width="8" height="8" fill="#ffffff" opacity="0.8"/>
  
  <rect x="105" y="140" width="6" height="6" fill="#ffffff" opacity="0.8"/>
  <rect x="105" y="155" width="6" height="6" fill="#ffffff" opacity="0.8"/>
  <rect x="105" y="170" width="6" height="6" fill="#ffffff" opacity="0.8"/>
  <rect x="120" y="140" width="6" height="6" fill="#ffffff" opacity="0.8"/>
  <rect x="120" y="155" width="6" height="6" fill="#ffffff" opacity="0.8"/>
  
  <rect x="195" y="135" width="10" height="10" fill="#ffffff" opacity="0.8"/>
  <rect x="195" y="155" width="10" height="10" fill="#ffffff" opacity="0.8"/>
  <rect x="195" y="175" width="10" height="10" fill="#ffffff" opacity="0.8"/>
  <rect x="210" y="135" width="10" height="10" fill="#ffffff" opacity="0.8"/>
  <rect x="210" y="155" width="10" height="10" fill="#ffffff" opacity="0.8"/>
  
  <!-- Icône Euro symbolisant les aides -->
  <circle cx="150" cy="80" r="25" fill="#28a745" opacity="0.9"/>
  <text x="150" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">€</text>
  
  <!-- Titre -->
  <text x="150" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Aides Entreprises</text>
  <text x="150" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Région Bruxelles-Capitale</text>
</svg>
