<!DOCTYPE html>
<html>
<head>
  <title>Test Stimulus UserType Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Stimulus via CDN -->
  <script type="module">
    import { Application } from "https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2.2/dist/stimulus.js"
    import { Controller } from "https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2.2/dist/stimulus.js"

    // UserType Controller
    class UserTypeController extends Controller {
      static targets = ["button"]

      connect() {
        console.log('🔗 UserType controller connecté - TEST DIRECT !')
        console.log('📊 Boutons trouvés:', this.buttonTargets.length)
        this.restoreSelection()
      }

      select(event) {
        console.log('🎯 Clic détecté sur:', event.currentTarget.dataset.user)

        const userType = event.currentTarget.dataset.user
        const selectedButton = event.currentTarget

        // Sauvegarder dans localStorage
        localStorage.setItem("userType", userType)

        // Réinitialiser tous les boutons
        this.buttonTargets.forEach(button => {
          button.classList.remove('btn-primary', 'selected')
          button.classList.add('btn-outline-primary')
          button.removeAttribute('data-selected')
        })

        // Marquer le bouton sélectionné
        selectedButton.classList.remove('btn-outline-primary')
        selectedButton.classList.add('btn-primary', 'selected')
        selectedButton.setAttribute('data-selected', 'true')

        console.log('✅ Bouton activé:', selectedButton.className)
      }

      restoreSelection() {
        const savedUserType = localStorage.getItem("userType")
        console.log('🔄 Restauration:', savedUserType)

        if (savedUserType) {
          const savedButton = this.buttonTargets.find(button =>
            button.dataset.user === savedUserType
          )

          if (savedButton) {
            // Réinitialiser tous les boutons
            this.buttonTargets.forEach(button => {
              button.classList.remove('btn-primary', 'selected')
              button.classList.add('btn-outline-primary')
              button.removeAttribute('data-selected')
            })

            // Marquer le bouton sauvegardé
            savedButton.classList.remove('btn-outline-primary')
            savedButton.classList.add('btn-primary', 'selected')
            savedButton.setAttribute('data-selected', 'true')

            console.log('✅ Bouton restauré:', savedButton.className)
          }
        }
      }
    }

    // Démarrer l'application
    const application = Application.start()
    application.debug = true
    window.Stimulus = application

    // Enregistrer le contrôleur
    application.register("user_type", UserTypeController)

    console.log('✅ Application Stimulus démarrée avec UserType controller')
  </script>

  <style>
    /* CSS pour la sélection de profil */
    [data-controller="user_type"] button.btn-primary,
    [data-controller="user_type"] button.selected {
      background-color: #0d6efd !important;
      border-color: #0d6efd !important;
      color: white !important;
    }

    [data-controller="user_type"] button.btn-outline-primary {
      background-color: transparent !important;
      color: #0d6efd !important;
      border-color: #0d6efd !important;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1>Test Stimulus UserType Controller</h1>

    <div class="mb-4">
      <div data-controller="user_type" class="card border-0 shadow-sm">
        <div class="card-header bg-light">
          <h4 class="card-title mb-0">
            <i class="bi bi-person-circle text-primary me-2"></i>
            Quel est votre profil ?
          </h4>
        </div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6">
              <button class="btn btn-outline-primary w-100"
                      data-action="click->user_type#select"
                      data-user="prive"
                      data-user_type-target="button">
                <i class="bi bi-house me-2"></i>Particulier
              </button>
            </div>
            <div class="col-md-6">
              <button class="btn btn-outline-primary w-100"
                      data-action="click->user_type#select"
                      data-user="entreprise"
                      data-user_type-target="button">
                <i class="bi bi-building me-2"></i>Entreprise
              </button>
            </div>
            <div class="col-md-6">
              <button class="btn btn-outline-primary w-100"
                      data-action="click->user_type#select"
                      data-user="syndic"
                      data-user_type-target="button">
                <i class="bi bi-people me-2"></i>Syndic
              </button>
            </div>
            <div class="col-md-6">
              <button class="btn btn-outline-primary w-100"
                      data-action="click->user_type#select"
                      data-user="bailleur"
                      data-user_type-target="button">
                <i class="bi bi-key me-2"></i>Bailleur social
              </button>
            </div>
            <div class="col-12">
              <button class="btn btn-outline-primary w-100"
                      data-action="click->user_type#select"
                      data-user="asbl"
                      data-user_type-target="button">
                <i class="bi bi-shield-check me-2"></i>ASBL / Coopérative
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="alert alert-info">
      <strong>Instructions :</strong>
      <ul>
        <li>Ouvrez la console du navigateur (F12)</li>
        <li>Cliquez sur les boutons pour tester la sélection</li>
        <li>Rechargez la page pour tester la persistance</li>
        <li>Vérifiez que les logs Stimulus apparaissent dans la console</li>
      </ul>
    </div>
  </div>
</body>
</html>
