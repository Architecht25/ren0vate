<div class="carte-prime-flandre"
     data-controller="flandre-isolation-toiture">

  <div class="prime-header">
    <h3>Isolation de toiture</h3>
    <p>Prime en €/m²</p>
  </div>

  <div class="prime-input">
    <label for="isolation_toiture_input">Surface (m²)</label>
    <input type="number"
           id="isolation_toiture_input"
           data-flandre-isolation-toiture-target="input"
           data-action="input->flandre-isolation-toiture#onInputChange"
           placeholder="Ex: 200"
           min="0">
  </div>

  <div class="prime-result">
    <span class="montant"
          data-flandre-isolation-toiture-target="result">0 €</span>
    <span class="label">Prime calculée</span>
  </div>

</div>
