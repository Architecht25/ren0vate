# Agent de veille réglementaire + production de contenu (MarketingDraftJob enchaîné
# automatiquement à la fin de IntelligenceReportJob) — réactivé le 17/07/2026.
production:
  intelligence_report_weekly:
    class: IntelligenceReportJob
    queue: default
    schedule: at 7am every monday

  # Diff mensuel des pages réglementaires officielles (wallonie.be, vlaanderen.be...)
  # — distinct de l'agent veille ci-dessus, voir RegulatoryWatchJob (22/08/2026).
  regulatory_watch_monthly:
    class: RegulatoryWatchJob
    queue: default
    schedule: "0 8 1 * *"

