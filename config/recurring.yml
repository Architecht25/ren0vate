# Étape 3 (23/11/2026) : alertes SLA support (aucun ticket reçu), séquences
# onboarding J+1/3/7 et nurturing freemium N+14/30/60 (contexte de fermeture, plus
# de poussée vers le payant) désactivés, blocs commentés dans `production:` ci-dessous.
# Prépare la suppression éventuelle du dyno worker. Réactiver = décommenter.

production:
  # RGPD art. 5(1)(e) — obligation légale indépendante de l'état du business.
  data_retention_quarterly:
    class: DataRetentionJob
    queue: default
    schedule: "0 3 1 1,4,7,10 *"

#  # SLA support (24h) affiché dans les tiers payants — réactivé le 22/08/2026 avec
#  # le premier client payant réel, pour tenir la promesse commerciale.
#  sla_alerts_support:
#    class: SlaAlertJob
#    queue: default
#    schedule: every hour

  # Surveillance active des délais de réponse admin (RequestProgress) et des
  # compléments de dossier expirés — jusqu'ici purement passif (calculé
  # seulement si l'utilisateur ouvrait sa page de suivi), voir audit du
  # parcours simulation→soumission→suivi Flandre (20/09/2026).
  request_progress_deadlines_daily:
    class: RequestProgressDeadlineJob
    queue: default
    schedule: at 8am every day

  # Relance invitations pros non répondues — flux referral, indépendant de la pause.
  pending_invitation_reminders:
    class: PendingInvitationReminderJob
    queue: default
    schedule: at 10am every day

