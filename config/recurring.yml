# Agent de veille réglementaire + production de contenu (MarketingDraftJob enchaîné
# automatiquement à la fin de IntelligenceReportJob) — réactivé le 17/07/2026.
production:
  intelligence_report_weekly:
    class: IntelligenceReportJob
    queue: default
    schedule: at 7am every monday

  # Diff mensuel des pages réglementaires officielles (wallonie.be, vlaanderen.be...)
  # — distinct de l'agent veille ci-dessus, voir RegulatoryWatchJob (22/08/2026).
  regulatory_watch_monthly:
    class: RegulatoryWatchJob
    queue: default
    schedule: "0 8 1 * *"

  # RGPD art. 5(1)(e) — obligation légale indépendante de l'état du business.
  data_retention_quarterly:
    class: DataRetentionJob
    queue: default
    schedule: "0 3 1 1,4,7,10 *"

  # SLA support (24h) affiché dans les tiers payants — réactivé le 22/08/2026 avec
  # le premier client payant réel, pour tenir la promesse commerciale.
  sla_alerts_support:
    class: SlaAlertJob
    queue: default
    schedule: every hour

  # Relance invitations pros non répondues — flux referral, indépendant de la pause.
  pending_invitation_reminders:
    class: PendingInvitationReminderJob
    queue: default
    schedule: at 10am every day

  # Séquence onboarding J+1/J+3/J+7 — utile pour toute nouvelle inscription.
  onboarding_sequence_emails:
    class: OnboardingSequenceJob
    queue: default
    schedule: at 10am every day

  # Séquence nurturing freemium N+14/30/60 — pousse vers le payant, pertinent
  # maintenant que le tunnel de paiement Stripe est validé de bout en bout.
  nurturing_sequence_emails:
    class: NurturingSequenceJob
    queue: default
    schedule: at 11am every day

