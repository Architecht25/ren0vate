# retour commercial). Les classes de jobs restent en place et les boutons admin
# (Admin::IntelligenceReportsController) permettent encore un lancement manuel.
# Pour réactiver : décommenter les deux blocs ci-dessous.
#
# Agent de veille + production de contenu (MarketingDraftJob enchaîné
# automatiquement à la fin de IntelligenceReportJob) — était actif depuis le 17/07/2026.
