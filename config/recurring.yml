# Vérifications des alertes factures
production:
  facture_alerts_daily:
    class: FactureAlertJob
    queue: default
    schedule: at 9am every day

  facture_alerts_urgent:
    class: FactureAlertJob
    queue: default
    schedule: every 6 hours

  peb_conformite_alerts_weekly:
    class: PebConformiteAlertJob
    queue: default
    schedule: at 9am every monday

  pending_invitation_reminders:
    class: PendingInvitationReminderJob
    queue: default
    schedule: at 10am every day

  dormant_project_alerts:
    class: DormantProjectAlertJob
    queue: default
    schedule: at 9am every monday

  data_retention_quarterly:
    class: DataRetentionJob
    queue: default
    schedule: "0 3 1 1,4,7,10 *"

  sla_alerts_support:
    class: SlaAlertJob
    queue: default
    schedule: every hour

  onboarding_sequence_emails:
    class: OnboardingSequenceJob
    queue: default
    schedule: at 10am every day

development:
  facture_alerts_dev:
    class: FactureAlertJob
    queue: default
    schedule: every 30 minutes
