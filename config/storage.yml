# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
cloudinary:
  service: Cloudinary
  cloud_name: <%= ENV.fetch('CLOUDINARY_CLOUD_NAME', '') %>
  api_key: <%= ENV.fetch('CLOUDINARY_API_KEY', '') %>
  api_secret: <%= ENV.fetch('CLOUDINARY_API_SECRET', '') %>
  folder: <%= Rails.env %>
  # Configuration optimisée - laissons Active Storage gérer automatiquement
  upload_options:
    use_filename: true
    unique_filename: true
    # Pas de resource_type fixe - sera déterminé par le content_type
  cache_control: "public, max-age=#{1.year.to_i}"

# Service local pour les PDFs pour éviter les problèmes Cloudinary
local_pdfs:
  service: Disk
  root: <%= Rails.root.join("storage") %>
