# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
cloudinary:
  service: Cloudinary
  cloud_name: <%= ENV.fetch('CLOUDINARY_CLOUD_NAME', '') %>
  api_key: <%= ENV.fetch('CLOUDINARY_API_KEY', '') %>
  api_secret: <%= ENV.fetch('CLOUDINARY_API_SECRET', '') %>
  folder: <%= Rails.env %>
  upload_options:
    resource_type: 'raw'

# V2 — Lot 0 : infrastructure de stockage cible (cahier des charges V2 §2 —
# objet S3-compatible UE, URLs signées à durée courte, jamais d'URL publique
# permanente). Service S3 standard de Rails pointé sur l'endpoint Scaleway ;
# aucun fichier n'y est encore écrit (migration des documents Cloudinary
# existants = Lot 1, pas Lot 0). `public: false` + durée d'URL signée courte
# sont à fixer explicitement dans Documents::Document une fois ce service
# branché, pas de valeur par défaut Active Storage à faire confiance ici.
scaleway:
  service: S3
  endpoint: <%= ENV.fetch('SCALEWAY_S3_ENDPOINT', '') %> # ex: https://s3.fr-par.scw.cloud
  region: <%= ENV.fetch('SCALEWAY_S3_REGION', 'fr-par') %>
  access_key_id: <%= ENV.fetch('SCALEWAY_S3_ACCESS_KEY_ID', '') %>
  secret_access_key: <%= ENV.fetch('SCALEWAY_S3_SECRET_ACCESS_KEY', '') %>
  bucket: <%= ENV.fetch('SCALEWAY_S3_BUCKET', '') %>
  force_path_style: true # requis par la compatibilité S3 de Scaleway (hors AWS)
  public: false
