    home: "Home"
    properties: "My properties"
    simulations: "Simulations"
    requests: "Requests"
    dashboard: "Dashboard"
    logout: "Logout"

  # General messages
  common:
    save: "Save"
    cancel: "Cancel"
    edit: "Edit"
    delete: "Delete"
    confirm: "Are you sure?"
    loading: "Loading..."
    please_correct_errors: "Please correct the errors below."
    current_language: "Current language"
    powered_by: "Powered by"

  # Regions
