      devis: "Quote/estimate"
      facture: "Invoices"
      etat_avancement: "Progress reports"
      attestation_entrepreneur: "Contractor certificates"
      certificat_peb: "EPC certificate"
      photo: "Photo evidence"
      plan: "Plans"
      permis_urbanisme: "Urban planning permit"
      dossier_prime: "Grant application file"
      certificat_protection: "Protection certificate"
      acte_notarial: "Notarial deed"
      compromis: "Sales agreement"
      # Energy audit documents
      preuve_paiement_audit: "Proof of audit payment"
      rapport_audit_energetique: "Complete energy audit report"
      # Banking documents
      rib: "Bank Account Details (RIB)"
