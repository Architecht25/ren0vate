default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # Pas de "database: cache" — config/database.yml n'est pas structuré en vrai
  # multi-db (url/adapter inline au même niveau que queue/cache/cable), donc
  # connects_to(:cache) ne résout jamais ce rôle (AdapterNotSpecified). Même
  # choix que Solid Queue (connects_to désactivé, voir production.rb) : la
  # table solid_cache_entries vit dans le schema principal, connexion par défaut.
  <<: *default
