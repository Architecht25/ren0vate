<!DOCTYPE html>
<html>
<head>
  <title>Test Stimulus</title>
  <script type="module">
    import { Application } from "https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2.2/dist/stimulus.js"

    const application = Application.start()
    application.debug = true

    // Test controller
    class TestController extends Controller {
      connect() {
        console.log("✅ Test controller connecté !")
      }
    }

    application.register("test", TestController)

    console.log("✅ Application Stimulus démarrée")
    console.log("📊 Contrôleurs enregistrés:", application.router.modules)
  </script>
</head>
<body>
  <div data-controller="test">
    <h1>Test Stimulus</h1>
    <p>Vérifiez la console pour les logs</p>
  </div>
</body>
</html>
